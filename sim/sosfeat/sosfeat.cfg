# SOS.INTERP: the "SOS NTRP" header, then the code at $A000, which must end
# below the kernel at $B800.
MEMORY {
    HDR:  start = $0000, size = $000E, file = %O;
    CODE: start = $A000, size = $1000, file = %O;
    RAM:  start = $B000, size = $0800, file = "";
}
SEGMENTS {
    HEADER: load = HDR,  type = ro;
    CODE:   load = CODE, type = rw;
    BSS:    load = RAM,  type = bss;
}
